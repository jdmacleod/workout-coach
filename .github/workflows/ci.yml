name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check coach/ tests/

      - name: Format check
        run: uv run ruff format --check coach/ tests/

      - name: Type check
        run: uv run mypy coach/

      - name: Test
        run: uv run pytest tests/ -m "not integration"

      - name: Build verification
        run: uv build
