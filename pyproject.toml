[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exercise-coach"
version = "0.2.0"
description = "Apple Notes-based fitness coaching CLI"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "icalendar>=5.0",
    "anthropic>=0.30",
    "rich>=13.0",
]

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.10",
]

[project.scripts]
coach = "coach.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["coach"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python idioms)
    "B",    # flake8-bugbear (likely bugs and design issues)
    "SIM",  # flake8-simplify (simplifiable code)
]
ignore = [
    "E501",   # line length — enforced by formatter, not linter
    "B008",   # function calls in default arguments — required by Typer
    "B904",   # raise-without-from-inside-except — typer.Exit is intentional CLI flow control
    "SIM108", # ternary operator — not always more readable
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a live Apple Notes.app (skip in CI with -m 'not integration')",
]
